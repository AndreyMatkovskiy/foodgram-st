services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: foodgram
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foodgram-network

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: foodgram-backend
    command: ["sh", "-c", "sleep 10 && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 foodgram.wsgi:application"]
    volumes:
      - static_volume:/var/www/app/static
      - media_volume:/var/www/app/media
    ports:
      - "8000:80"
    environment:
      POSTGRES_DB: foodgram
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    networks:
      - foodgram-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: foodgram-frontend
    ports:
      - "3000:80"
    networks:
      - foodgram-network

  nginx:
    image: nginx:1.25-alpine
    container_name: foodgram-proxy
    ports:
      - "9000:80"
    volumes:
      - ../frontend/build:/usr/share/nginx/html
      - static_volume:/var/www/app/static 
      - media_volume:/var/www/app/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - foodgram-network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  foodgram-network:
    driver: bridge
